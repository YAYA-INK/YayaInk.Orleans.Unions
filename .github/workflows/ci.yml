name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Pack
        run: dotnet pack src/YayaInk.Orleans.Unions/YayaInk.Orleans.Unions.csproj --configuration Release --no-build --output artifacts
        # generator package is packed by its own csproj invocation:
      - name: Pack generators
        run: dotnet pack src/YayaInk.Orleans.Unions.Generators/YayaInk.Orleans.Unions.Generators.csproj --configuration Release --no-build --output artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: artifacts/*.nupkg
