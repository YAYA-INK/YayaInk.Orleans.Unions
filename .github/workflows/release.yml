name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Pack runtime
        run: dotnet pack src/YayaInk.Orleans.Unions/YayaInk.Orleans.Unions.csproj --configuration Release --no-build --output artifacts

      - name: Pack generators
        run: dotnet pack src/YayaInk.Orleans.Unions.Generators/YayaInk.Orleans.Unions.Generators.csproj --configuration Release --no-build --output artifacts

      - name: List artifacts
        run: Get-ChildItem artifacts | Format-Table Name, Length
        shell: pwsh

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: pwsh
        run: |
          $packages = Get-ChildItem artifacts -Filter *.nupkg -File
          if (-not $packages) { throw "No nupkg files found in artifacts/" }
          foreach ($p in $packages) {
            Write-Host "Pushing $($p.Name)"
            dotnet nuget push $p.FullName `
              --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Push failed for $($p.Name)" }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: artifacts/*.nupkg

      - name: Create GitHub Release
        # Only create a GitHub Release when the workflow is triggered by a tag push.
        # Manual workflow_dispatch runs (typically on `main`) have no tag and would
        # otherwise fail this step with "GitHub Releases requires a tag".
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*.nupkg
